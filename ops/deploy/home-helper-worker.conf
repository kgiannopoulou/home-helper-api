; Supervisor: keeps two queue workers running and restarts them if they die.
; /etc/supervisor/conf.d/home-helper-worker.conf, then:
;   supervisorctl reread && supervisorctl update
; After each deploy: php artisan queue:restart (workers finish their job, then reload the code)
[program:home-helper-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/home-helper/artisan queue:work redis --queue=default,households --sleep=3 --tries=3 --max-time=3600
directory=/var/www/home-helper
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Longer than the longest job ($timeout 120 s), so a stop lets it finish
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/www/home-helper/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
