name: agent

# The C++ local agent (agent/, docs in agent/docs). Runs when the agent, the
# Laravel side it talks to, or this file changes.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'agent/**'
      - 'app/Agents/**'
      - 'app/Http/Controllers/Api/Agent/**'
      - 'routes/**'
      - 'database/migrations/**'
      - '.github/workflows/agent.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -j 4

      - name: Smoke test the binary
        shell: bash
        run: |
          ./build/home-helper-agent version
          ./build/home-helper-agent help

      - name: Check the Linux install script
        if: runner.os == 'Linux'
        run: shellcheck packaging/linux/install.sh

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-helper-agent-${{ runner.os }}
          path: |
            agent/build/home-helper-agent
            agent/build/home-helper-agent.exe
          if-no-files-found: ignore

  # Memory errors and undefined behaviour, on the whole test suite
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DHHA_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -j 4
