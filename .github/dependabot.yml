# Weekly dependency updates, grouped so a week's minor and patch bumps arrive
# as one pull request per ecosystem. Each one has to pass the required checks
# (tests, static-analysis, dependency-audit) before it can be merged. The
# cooldown waits a few days after a release, so a bad one is usually pulled first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      php-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      js-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
